[workspace]
members = ["mex-*"]
default-members = ["mex-start"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.226", features = ["derive"] }
mex-app = { path = "./mex-app/" }
mex-core = { path = "./mex-core/" }
mex-keys = { path = "./mex-keys/" }
mex-render = { path = "./mex-render/" }
ratatui = "0.29.0"
serde_json = "1.0.145"
rayon = "1.11.0"
crop = "0.4.3"
toml = "0.9.8"
