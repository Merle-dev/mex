mode-n = { mode = "nisrb", keys = "{esc}" } # Do not remove this if you dont know what you are doing
print = { mode = "n", keys = "{space}{num}p" }
remove = { mode = "ns", keys = "{space}{num}x" }
yank = { mode = "n", keys = "yy" }
quit = { mode = "n", keys = "{space}c" }
save = { mode = "n", keys = "{space}s" }
input = { mode = "nisrb", keys = ":" }
mode-i = { mode = "nisrb", keys = "i" }
mode-v = { mode = "nisrb", keys = "v" }
mode-r = { mode = "nisrb", keys = "r" }
